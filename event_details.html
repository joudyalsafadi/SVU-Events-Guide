  /*  استخراج معامل */
  function getUrlParameter(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  /*  إضافة للتقويم  */
  function addToCalendar(eventTitle, eventDate) {
    const [day, month, year] = eventDate.split('/');
    const startDate = `${year}${month}${day}T100000Z`;
    const endDate   = `${year}${month}${day}T120000Z`;

    const iCalContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SVU Events//AR\nBEGIN:VEVENT\nUID:${eventTitle}@svuonline.org\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z\nDTSTART:${startDate}\nDTEND:${endDate}\nSUMMARY:${eventTitle}\nLOCATION:الجامعة الافتراضية السورية\nEND:VEVENT\nEND:VCALENDAR`;

    const blob = new Blob([iCalContent], { type: 'text/calendar' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `${eventTitle.replace(/\s+/g,'_')}.ics`;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(url);
    document.body.removeChild(a);

    showSuccessMessage(' تمت إضافة الفعالية إلى التقويم!');
  }

  

  function showSuccessMessage(message) {
    const container  = document.getElementById('eventContainer');
    let successDiv   = container.querySelector('.success-message');
    if (!successDiv) {
      successDiv = document.createElement('div');
      successDiv.className = 'success-message';
      container.insertBefore(successDiv, container.firstChild);
    }
    successDiv.textContent = message;
    successDiv.classList.add('show');
    setTimeout(() => successDiv.classList.remove('show'), 4000);
  }

  
  function getRelatedEvents(currentId, category) {
    const all = Object.entries(eventsData).filter(([id]) => id !== String(currentId));
    const same = all.filter(([, e]) => e.categoryEn === category);
    const other = all.filter(([, e]) => e.categoryEn !== category);
    return same.slice(0,3).concat(other.slice(0, Math.max(0, 3 - same.length)))
      .map(([id, e]) => ({ id, ...e }));
  }

 
  function buildRelatedEventsHTML(currentId, categoryEn) {
    const related = getRelatedEvents(currentId, categoryEn);
    if (!related.length) return '';
    return `
      <div class="related-events">
        <h2><i class="bi bi-link-45deg"></i> فعاليات ذات صلة</h2>
        <div class="related-cards">
          ${related.map(ev => `
            <div class="related-card">
              <img src="${ev.image}" alt="${ev.title}">
              <div class="related-card-content">
                <h3 class="related-card-title">${ev.title}</h3>
                <div class="related-card-meta">
                  <i class="bi bi-calendar3"></i> ${ev.date} &nbsp;•&nbsp;
                  <i class="bi bi-geo-alt"></i> ${ev.location}
                </div>
                <a href="event_details.html?id=${ev.id}" class="related-card-button">عرض التفاصيل</a>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

 
  function displayEventDetails() {
    const eventId  = getUrlParameter('id');
    const container = document.getElementById('eventContainer');

    if (eventId && eventsData[eventId]) {
      const ev = eventsData[eventId];

      // معرض الصور
      const galleryHTML = ev.gallery?.length ? `
        <div class="gallery-section">
          <h2><i class="bi bi-images"></i> معرض الصور</h2>
          <div class="gallery-grid">
            ${ev.gallery.map(img => `
              <div class="gallery-item">
                <img src="${img}" alt="صورة الفعالية">
              </div>`).join('')}
          </div>
        </div>` : '';

      // الخريطة
      const mapHTML = ev.mapUrl ? `
        <div class="map-section">
          <h2><i class="bi bi-geo-alt-fill"></i> موقع الفعالية</h2>
          <div class="map-container">
            <iframe src="${ev.mapUrl}" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>` : '';

      container.innerHTML = `
        <a href="events.html" class="back-button">
          <i class="bi bi-arrow-right"></i> العودة إلى الفعاليات
        </a>
        <div class="success-message"></div>

        <img src="${ev.image}" alt="${ev.title}" class="event-details-image">

        <div class="event-details-content">
          <h1>${ev.title}</h1>

          <div class="event-details-meta">
            <div class="event-meta-item">
              <strong><i class="bi bi-calendar3"></i> التاريخ:</strong>
              <span>${ev.date}</span>
            </div>
            <div class="event-meta-item">
              <strong><i class="bi bi-geo-alt"></i> المكان:</strong>
              <span>${ev.location}</span>
            </div>
            <div class="event-meta-item">
              <strong><i class="bi bi-tag"></i> التصنيف:</strong>
              <span class="event-category">${ev.category}</span>
            </div>
          </div>

          <div class="action-buttons">
            <button class="action-button participate-button" onclick="participateEvent('${ev.title}')">
              <i class="bi bi-person-plus"></i> سجّل حضورك
            </button>
            <button class="action-button calendar-button" onclick="addToCalendar('${ev.title}', '${ev.date}')">
              <i class="bi bi-calendar-plus"></i> أضف للتقويم
            </button>
          </div>

          <div class="event-details-description">
            <h2 style="font-size:1.15rem; font-weight:800; color:#1a3c5e; margin-bottom:.8rem;">
              <i class="bi bi-info-circle"></i> عن هذه الفعالية
            </h2>
            <p>${ev.description}</p>
          </div>

          ${galleryHTML}
          ${mapHTML}
          ${buildRelatedEventsHTML(eventId, ev.categoryEn)}
        </div>`;

    } else {
      container.innerHTML = `
        <div class="event-not-found">
          <i class="bi bi-exclamation-circle" style="font-size:3rem; color:#f4a62a; display:block; margin-bottom:1rem;"></i>
          <h2>الفعالية غير موجودة</h2>
          <p>عذراً، لم نتمكن من العثور على الفعالية التي تبحث عنها.</p>
          <a href="events.html">العودة إلى قائمة الفعاليات</a>
        </div>`;
    }
  }

  window.addEventListener('DOMContentLoaded', displayEventDetails);

  
</script>
